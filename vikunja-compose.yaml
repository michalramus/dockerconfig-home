services:
  vikunja:
    image: vikunja/vikunja:2.5.0
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://vikunja.ramus.ovh
      VIKUNJA_DATABASE_HOST: ${DB_HOSTNAME}
      VIKUNJA_DATABASE_USER: ${DB_USER}
      VIKUNJA_DATABASE_PASSWORD: ${DB_PASSWORD}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_DATABASE: ${DB_DATABASE_NAME}
      VIKUNJA_SERVICE_SECRET: ${SECRET}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: false
    volumes:
      - /docker/storage/vikunja:/app/vikunja/files
    networks:
      - nginx-bridge
    restart: unless-stopped

networks:
  nginx-bridge:
    name: nginx-bridge
    external: true
